# Checks on every push and pull request: typecheck and the fast unit suites,
# on Windows (the primary platform) and Linux. Packaging and the slow suites
# run in the release workflow.

name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Checks only read the repository (audit SEC-08).
permissions:
  contents: read

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile
      - name: Typecheck (tsc -b)
        working-directory: desktop
        run: ./node_modules/.bin/tsc -b
      - name: Unit tests
        working-directory: desktop
        run: bun run test --fast
