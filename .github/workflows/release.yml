# Release: every version tag builds every supported OS and architecture,
# runs the checks, and publishes one GitHub Release with all the packages.
#
#   git tag v1.2.3 && git push origin v1.2.3
#
# Nothing is published unless every build succeeds: the release job needs all
# of them, so a failure on one platform leaves no half-populated release. Each
# build job also proves its packages work before uploading them: the package
# carries its runtime, built for the right CPU (verify-package.mjs), and every
# artifact a user downloads installs, launches twice and checks itself — the
# window, the bundled ffmpeg/mpv, the sidecar on the bundled JRE, webtorrent's
# native modules, data kept across a restart, a clean exit (smoke-package.mjs).
# The publish job then checks the full set is present (verify-release.mjs) and
# creates the release as a draft until every file is uploaded, so an upload
# that fails half-way is never visible as a release.
#
# A manual run (workflow_dispatch) builds and tests everything and uploads the
# artifacts to the run without publishing, for checking a release before
# tagging it.
#
# beta.yml calls this workflow (workflow_call) with a semver prerelease version
# (1.1.0-beta.20261023.7) and publish: true. The same builds and checks run, and
# the release is tagged v<version> at the commit built and published as a
# prerelease; the app's beta channel reads it (App Update PRD §4.3). A tag the
# workflow pushed itself would not start this workflow, which is why it is
# called rather than triggered.
#
# Artifacts are named CS3-<version>-<os>-<arch>[-<kind>].<ext>
# (electron-builder.yml; tools/package/package-layout.mjs is the check), with a
# SHA256SUMS.txt beside them.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to name the artifacts (no leading v), e.g. 1.2.3'
        required: true
  workflow_call:
    inputs:
      version:
        description: 'Version to name and tag the release (no leading v)'
        type: string
        required: true
      publish:
        description: 'Publish a release tagged v<version> at this commit'
        type: boolean
        default: false

# Read-only by default (audit SEC-08): the build jobs run `bun install`, whose
# dependency scripts must not hold a token that can rewrite the repository or
# its releases. Only the publish job is given write access, below.
permissions:
  contents: read
  # SignPath reads the unsigned artifact through this run's token.
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '21'

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a semantic version (expected v1.2.3)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  checks:
    name: Checks (${{ matrix.os }})
    needs: version
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Install dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile
      - name: Typecheck (tsc -b)
        working-directory: desktop
        run: ./node_modules/.bin/tsc -b
      - name: Unit tests
        working-directory: desktop
        run: bun run test --fast
      - name: Sidecar tests (mvn test)
        # On every OS: what the sidecar does with files — replacing an archive,
        # a class loader holding a .cs3 open — is exactly what differs on Windows.
        run: mvn -B -q -f sidecar/pom.xml test

  build:
    name: Build ${{ matrix.label }}
    needs: [version, checks]
    strategy:
      # One failure fails the release; finishing the others would only make
      # artifacts nobody can publish.
      fail-fast: true
      matrix:
        include:
          - { label: windows-x64, os: windows-latest, arch: x64 }
          # macos-13 was retired in December 2025; macos-15-intel is the last
          # Intel image GitHub offers (until autumn 2027).
          - { label: macos-x64, os: macos-15-intel, arch: x64 }
          - { label: macos-arm64, os: macos-14, arch: arm64 }
          # 22.04 on both Linux architectures: a package links against the
          # build machine's glibc, and 2.35 runs on far more installs than 2.39.
          - { label: linux-x64, os: ubuntu-22.04, arch: x64 }
          - { label: linux-arm64, os: ubuntu-22.04-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Code signing, from repository secrets only (docs/release/distribution.md).
      # Without them the build is unsigned, and the publish job can only release
      # it as a prerelease. `vars.REQUIRE_SIGNING == 'true'` makes an unsigned or
      # invalid signature fail this job instead.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
      AZURE_CERT_PROFILE: ${{ vars.AZURE_CERT_PROFILE }}
      AZURE_PUBLISHER_NAME: ${{ vars.AZURE_PUBLISHER_NAME }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      # `with` belongs to its step. Written as its own list item it was a step
      # with neither `uses` nor `run`, which GitHub rejects before running anything.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Linux packaging tools, and what the smoke test needs to run Electron
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          fakeroot dpkg libarchive-tools xz-utils
          xvfb xauth libgtk-3-0 libnss3 libxss1 libxtst6 libatspi2.0-0 libsecret-1-0 libnotify4
          libgbm1 libasound2 libdrm2 libxkbcommon0 xdg-utils
      - name: Cache media archives
        uses: actions/cache@v4
        with:
          path: .cache/media-runtime
          key: media-${{ matrix.label }}-${{ hashFiles('tools/package/build-media-runtime.mjs') }}
      - name: Install dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile
      - name: Build packages
        # --fast: a fresh checkout's timestamps are all "now", so the
        # incremental check would rebuild everything; the vendored runtime jars
        # in sidecar/runtime/ are used as they are (no jitpack round trip). The
        # sidecar jar and the JRE are still built, because neither is in git.
        run: |
          for variable in CSC_LINK CSC_KEY_PASSWORD AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET \
            AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT AZURE_CERT_PROFILE AZURE_PUBLISHER_NAME \
            APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!variable}" ]; then unset "$variable"; fi
          done
          node tools/package/build-installer.mjs --fast --arch ${{ matrix.arch }} --version "$VERSION"
      # Windows signing through SignPath Foundation (free for open source),
      # once the repository variables name a SignPath project. The installer,
      # the portable exe and the portable zip go up as one artifact; SignPath's
      # artifact configuration signs each, and the app's own exe inside the
      # zip. The signed copies replace these before anything is checked or
      # launched. Every request waits for an approver in SignPath.
      - name: Upload Windows packages for signing
        id: unsigned
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ matrix.label }}
          if-no-files-found: error
          retention-days: 1
          path: |
            desktop/release/CS3-*.exe
            desktop/release/CS3-*.zip
      - name: Sign with SignPath (waits for approval)
        if: steps.unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ runner.temp }}/signed
          parameters: |
            version: ${{ toJSON(env.VERSION) }}
      - name: Put the signed packages in place
        if: steps.unsigned.outcome == 'success'
        run: cp -f "${{ runner.temp }}"/signed/CS3-* desktop/release/
      - name: Check the package carries its runtime, built for this CPU
        run: node tools/package/verify-package.mjs --arch ${{ matrix.arch }} --version "$VERSION"
      - name: Install and launch every package (smoke test)
        # The unpacked app, then each artifact as a user gets it — installer,
        # portable, zip; dmg, zip; AppImage, deb, tarball — each launched twice
        # against one fresh profile. Linux runs under xvfb and without
        # Chromium's sandbox: that depends on the host's kernel policy, which
        # the deb's postinst sets up on a real install and a runner does not
        # represent. Reaching a repository is reported, not required.
        run: >-
          node tools/package/smoke-package.mjs --installed
          --arch ${{ matrix.arch }} --version "$VERSION"
          --work "${{ runner.temp }}/smoke" --keep
          ${{ runner.os == 'Linux' && '--no-sandbox' || '' }}
      - name: Keep the smoke logs of a failed launch
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-${{ matrix.label }}
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore
          retention-days: 14
      - name: Check the signatures on what users download
        # After packaging, on the final artifacts. Required when the repository
        # says so; otherwise reported, and recorded for the publish job.
        id: signatures
        run: >-
          node tools/package/verify-signatures.mjs
          ${{ vars.REQUIRE_SIGNING == 'true' && runner.os != 'Linux' && '--require' || '' }}
          ${{ steps.unsigned.outcome == 'success' && '--downloads-only' || '' }}
      - name: Record the signing state
        run: echo "${{ runner.os == 'Linux' && 'n/a' || steps.signatures.outputs.signed }}" > "desktop/release/SIGNING-${{ matrix.label }}.txt"
      - name: Software bill of materials
        if: matrix.label == 'linux-x64'
        working-directory: desktop
        run: npx --yes @cyclonedx/cyclonedx-npm@6 --omit dev --ignore-npm-errors --output-file release/CS3-sbom.cdx.json
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: cs3-${{ matrix.label }}
          if-no-files-found: error
          path: |
            desktop/release/SIGNING-*.txt
            desktop/release/CS3-sbom.cdx.json
            desktop/release/CS3-*.exe
            desktop/release/CS3-*.zip
            desktop/release/CS3-*.dmg
            desktop/release/CS3-*.AppImage
            desktop/release/CS3-*.deb
            desktop/release/CS3-*.tar.gz

  release:
    name: Publish release
    needs: [version, build]
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.publish == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The one job that publishes, and so the only one that may write.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: cs3-*
          merge-multiple: true
      - name: The whole release is here
        # Every artifact of every target by its release name, the SBOM, and a
        # signing record per target — or nothing is published.
        run: node tools/package/verify-release.mjs dist "${{ needs.version.outputs.version }}"
      - name: Checksums
        working-directory: dist
        run: sha256sum CS3-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Signing state across platforms
        # Any Windows or macOS artifact that is not validly signed makes this a
        # prerelease: an unsigned build is never published as a normal release
        # by accident (PRD §126.6). Linux records `n/a`.
        id: signing
        working-directory: dist
        run: |
          cat SIGNING-*.txt
          if grep -qx 'false' SIGNING-*.txt; then
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Some Windows/macOS artifacts are unsigned; publishing as a prerelease."
          else
            echo "complete=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create the release as a draft
        # A draft until every file is uploaded: an upload that fails half-way
        # leaves a draft nobody sees, never a release missing a platform.
        uses: softprops/action-gh-release@v2
        with:
          # The tag for a called (beta) run, which has no tag of its own; a tag
          # push names the same tag it was started by.
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          draft: true
          name: CloudStream 3 Desktop ${{ needs.version.outputs.version }}${{ steps.signing.outputs.complete != 'true' && ' (unsigned preview)' || '' }}
          generate_release_notes: true
          prerelease: ${{ contains(needs.version.outputs.version, '-') || steps.signing.outputs.complete != 'true' }}
          body_path: .github/release-notes.md
          files: |
            dist/CS3-*
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
      - name: Publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v${{ needs.version.outputs.version }}" --repo "${{ github.repository }}" --draft=false
