# Packaging configuration for CloudStream Desktop.
#
# This lives here rather than in package.json's "build" field because the
# reasoning below is worth keeping next to the settings it explains, and
# electron-builder 26 rejects any key it does not recognise — including the
# "//comment" keys the JSON version used, which failed the whole build with
# "configuration has an unknown property '//extraResources'". YAML has real
# comments; JSON does not.
#
# Build with `bun run dist` (tools/package/build-installer.mjs) on the OS you
# are packaging for; it produces everything referenced here before invoking
# electron-builder. The release workflow runs it once per OS and architecture.
#
# Every artifact is named CS3-<version>-<os>-<arch>[-<kind>].<ext>, so a release
# page reads as a table: which file is mine is answered by the name alone.

appId: com.lagradost.cloudstream3.desktop
productName: CloudStream 3 Desktop

directories:
  output: release

files:
  - dist/**/*
  - dist-electron/**/*
  - node_modules/**/*

# The end user installs one thing and streams. That means the JVM, the sidecar
# and the whole provider classpath ship inside the app — SidecarSupervisor
# looks for exactly these paths under resources/sidecar when app.isPackaged,
# and MpvEngine/MediaInspector look under resources/media. A package missing
# either is a complete, installable app that can run no extension and decode
# nothing the browser cannot, with nothing on screen saying so.
extraResources:
  - from: ../sidecar/dist
    to: sidecar
  - from: media-runtime
    to: media

# Native .node binaries cannot be loaded from inside an asar archive, and
# webtorrent's transitive native deps must be unpacked or the app fails at
# startup exactly as it does when they are bundled.
asarUnpack:
  - '**/*.node'
  - node_modules/node-datachannel/**
  - node_modules/utp-native/**

win:
  # x64 explicitly: an ia32 build cannot load the x64 native .node binaries
  # webtorrent pulls in, and electron-builder will happily attempt one if the
  # default ever changes.
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
    - target: zip
      arch: [x64]
  # The zip of the unpacked app, for machines whose policy forbids running a
  # self-extracting portable exe. Same contents as the portable build.
  artifactName: CS3-${version}-windows-${arch}-portable.${ext}

# macOS: a dmg to drag into Applications and a zip of the same .app. Built
# unsigned by default (`identity: null`); `tools/package/after-pack.cjs` gives
# the bundle an ad-hoc signature so it launches on Apple silicon, and a real
# Developer ID is used when CSC_LINK is provided. An app downloaded without
# notarisation is quarantined by Gatekeeper — the release notes say how to
# open it (right-click → Open, or `xattr -dr com.apple.quarantine`).
mac:
  category: public.app-category.entertainment
  target:
    - dmg
    - zip
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  artifactName: CS3-${version}-macos-${arch}.${ext}
dmg:
  artifactName: CS3-${version}-macos-${arch}.${ext}

# Linux: an AppImage that runs on any distribution, a deb for Debian/Ubuntu,
# and a tarball. mpv and aria2 are the distribution's packages rather than
# bundled copies (the packaged mpv is the one wired to VA-API/VDPAU), so the
# deb recommends them and the app tells an AppImage user how to install them.
linux:
  category: AudioVideo
  synopsis: Stream and download with CloudStream extensions
  description: Desktop CloudStream 3 — runs community .cs3 extensions, streams torrents and plays everything through ffmpeg and mpv.
  maintainer: CloudStream Desktop contributors
  executableName: cloudstream3-desktop
  target:
    - AppImage
    - deb
    - tar.gz
  artifactName: CS3-${version}-linux-${arch}.${ext}
deb:
  recommends:
    - mpv
    - aria2
  artifactName: CS3-${version}-linux-${arch}.${ext}
appImage:
  artifactName: CS3-${version}-linux-${arch}.${ext}

afterPack: ../tools/package/after-pack.cjs

# oneClick:false with perMachine:false is what makes this installable by
# anyone on any machine: a per-user install needs no administrator and raises
# no UAC prompt, which is the difference between a download an ordinary person
# can run and one their machine refuses. allowElevation stays true so someone
# who *wants* a machine-wide install can still choose it.
#
# deleteAppDataOnUninstall is false deliberately: %APPDATA% holds the installed
# extensions, the library, watch progress and the provisioned runtime, and
# erasing all of it on an uninstall-to-reinstall is a data loss the user did
# not ask for.
# Double-clicking a .torrent, and clicking a magnet link, open this app.
#
# Both route to the same place: Windows passes an associated file and a
# protocol argument as ordinary argv entries, which `openableFromArgv` reads.
# The single-instance lock is what stops a second double-click starting a
# second app with its own sidecar and its own torrent client contending for one
# cache directory.
fileAssociations:
  - ext: torrent
    name: BitTorrent file
    description: Open in CloudStream 3 Desktop
    mimeType: application/x-bittorrent
    role: Viewer
protocols:
  - name: Magnet link
    schemes:
      - magnet

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CloudStream 3 Desktop
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  artifactName: CS3-${version}-windows-${arch}-installer.${ext}

# The portable target unpacks to a fixed directory name so successive runs
# reuse one extraction rather than filling %TEMP% with ~400 MB copies.
portable:
  unpackDirName: CloudStream3Desktop
  requestExecutionLevel: user
  artifactName: CS3-${version}-windows-${arch}-portable.${ext}

# The payload is dominated by a jlinked JRE, ffmpeg and mpv — all highly
# compressible and all shipped on every download.
compression: maximum

# @electron/rebuild is off because nothing here needs it, and leaving it on
# fails the build on any machine without Visual Studio.
#
# Measured on this dependency tree: every native module here is N-API, whose
# ABI is stable across Node and Electron, so there is nothing for a rebuild to
# change. node-datachannel declares napi_versions [8]; utp-native, bufferutil
# and utf-8-validate all ship prebuilds/win32-x64. @electron/rebuild ran
# node-gyp against bufferutil anyway and failed for want of Visual Studio —
# rebuilding from source a module that already has the prebuild it needs.
#
# bufferutil and utf-8-validate are also *optional* dependencies of
# bittorrent-tracker — native accelerators for ws's masking and UTF-8
# validation — so even losing them costs some throughput on tracker
# WebSockets rather than a feature.
#
# If a genuinely non-N-API native dependency is ever added, this must go back
# to true and the build machine needs the C++ toolchain.
npmRebuild: false
